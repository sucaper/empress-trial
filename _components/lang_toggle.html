<script>
window.addEventListener('DOMContentLoaded', function () {
  var navs = document.querySelectorAll('.navbar-nav');
  if (!navs.length) return;
  var nav = null;
  for (var i = navs.length - 1; i >= 0; i--) {
    if (navs[i].className.indexOf('ms-auto') !== -1) { nav = navs[i]; break; }
  }
  if (!nav) nav = navs[navs.length - 1];
  var path = window.location.pathname;
  var isEn, rel, target;
  if (window.location.protocol === 'file:') {
    var m = path.replace(/^\/[A-Za-z]:/, '').split('/_site/');
    rel = m.length > 1 ? m[1] : path.replace(/^\//, '');
    isEn = /^en(\/|$)/.test(rel);
    if (isEn) {
      var sub = rel.replace(/^en\//, '');
      var ups = sub.indexOf('/') >= 0 ? '../'.repeat(sub.split('/').length) : '../';
      target = ups + sub;
    } else {
      var dirs = rel.split('/').length - 1;
      target = '../'.repeat(dirs) + 'en/' + rel;
    }
  } else {
    rel = path;
    isEn = /^\/en(\/|$)/.test(path);
    if (isEn) {
      target = rel.replace(/^\/en/, '') || '/';
      if (target === '/index.html') target = '/';
    } else {
      target = rel === '/' || rel === '' ? '/en/' : '/en' + rel;
      if (target === '/en/index.html') target = '/en/';
    }
  }
  var li = document.createElement('li');
  li.className = 'nav-item lang-toggle-li';
  var a = document.createElement('a');
  a.className = 'nav-link lang-toggle';
  a.href = target;
  a.textContent = isEn ? '中文' : 'English';
  li.appendChild(a);
  nav.appendChild(li);
});
</script>

<!-- 规范网址（canonical）与语言版本（hreflang）按当前页面路径自动补全 -->
<script>
(function () {
  if (location.protocol === 'file:') return;
  var p = location.pathname;
  if (p.slice(-11) === '/index.html') p = p.slice(0, -10);
  else if (p.slice(-5) === '.html') p = p.slice(0, -5);
  if (p === '') p = '/';
  var base = location.origin;
  var isEn = /^\/en(\/|$)/.test(p);
  var zhPath = isEn ? (p.replace(/^\/en/, '') || '/') : p;
  var enPath = isEn ? p : (p === '/' ? '/en/' : '/en' + p);
  var zhUrl = base + zhPath, enUrl = base + enPath, self = base + p;

  function addLink(rel, href, hreflang) {
    var l = document.createElement('link');
    l.rel = rel; l.href = href;
    if (hreflang) l.hreflang = hreflang;
    document.head.appendChild(l);
  }
  addLink('canonical', self);
  addLink('alternate', zhUrl, 'zh-CN');
  addLink('alternate', enUrl, 'en');
  addLink('alternate', zhUrl, 'x-default');

  function addMeta(prop, val, isName) {
    if (!val) return;
    var m = document.createElement('meta');
    m.setAttribute(isName ? 'name' : 'property', prop);
    m.content = val;
    document.head.appendChild(m);
  }
  var d = document.querySelector('meta[name="description"]');
  addMeta('og:title', document.title);
  addMeta('og:description', d ? d.content : '');
  addMeta('og:url', self);
  addMeta('og:type', 'website');
  addMeta('twitter:card', 'summary', true);
  addMeta('twitter:title', document.title, true);
  addMeta('twitter:description', d ? d.content : '', true);
})();
</script>
